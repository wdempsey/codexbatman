<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#091422"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101e30"/>
      <stop offset="100%" stop-color="#0c1826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c7cfa"/>
      <stop offset="100%" stop-color="#3bc9db"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="380" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#5c7cfa" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="0" y1="360" x2="640" y2="360"/>
    <line x1="80" y1="0" x2="80" y2="380"/>
    <line x1="160" y1="0" x2="160" y2="380"/>
    <line x1="240" y1="0" x2="240" y2="380"/>
    <line x1="320" y1="0" x2="320" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
    <line x1="560" y1="0" x2="560" y2="380"/>
  </g>

  <!-- Terminal window -->
  <rect x="30" y="28" width="420" height="240" rx="10" fill="url(#termBg)" stroke="#1e3a5a" stroke-width="1.2"/>
  <!-- Title bar -->
  <rect x="30" y="28" width="420" height="32" rx="10" fill="#152840"/>
  <rect x="30" y="44" width="420" height="16" fill="#152840"/>
  <!-- Traffic lights -->
  <circle cx="56" cy="44" r="6" fill="#ff5f57"/>
  <circle cx="76" cy="44" r="6" fill="#ffbd2e"/>
  <circle cx="96" cy="44" r="6" fill="#28c840"/>
  <!-- Terminal title -->
  <text x="230" y="49" text-anchor="middle" fill="#6b8cae" font-size="11" font-family="'DM Sans', sans-serif">Terminal</text>

  <!-- Prompt lines -->
  <text x="50" y="88" fill="#3bc9db" font-size="12">$</text>
  <text x="64" y="88" fill="#e2e8f0" font-size="12">codex --version</text>

  <text x="50" y="110" fill="#74c7ec" font-size="11.5">codex 1.0.0</text>

  <text x="50" y="138" fill="#3bc9db" font-size="12">$</text>
  <text x="64" y="138" fill="#e2e8f0" font-size="12">codex run example_prompt.md</text>

  <text x="50" y="160" fill="#a6e3a1" font-size="11">✓ Prompt loaded</text>
  <text x="50" y="176" fill="#a6e3a1" font-size="11">✓ Schema validated</text>
  <text x="50" y="192" fill="#a6e3a1" font-size="11">✓ Workflow gates: 3/3 passed</text>
  <text x="50" y="208" fill="#a6e3a1" font-size="11">✓ Output written: problem_frame.md</text>

  <text x="50" y="236" fill="#3bc9db" font-size="12">$</text>
  <!-- Blinking cursor -->
  <rect x="64" y="224" width="8" height="14" fill="#5c7cfa" opacity="0.9" rx="1"/>

  <!-- Step labels on right -->
  <g font-family="'DM Sans', sans-serif">
    <!-- Step 1 -->
    <rect x="475" y="42" width="140" height="62" rx="8" fill="#112236" stroke="#1e3a5a" stroke-width="1"/>
    <rect x="475" y="42" width="4" height="62" rx="2" fill="#5c7cfa"/>
    <text x="489" y="62" fill="#5c7cfa" font-size="9" font-weight="700" letter-spacing="0.08em">STEP 1</text>
    <text x="489" y="77" fill="#c8d8ee" font-size="11">Install Codex</text>
    <text x="489" y="93" fill="#6b8cae" font-size="10">brew install codex</text>

    <!-- Step 2 -->
    <rect x="475" y="118" width="140" height="62" rx="8" fill="#112236" stroke="#1e3a5a" stroke-width="1"/>
    <rect x="475" y="118" width="4" height="62" rx="2" fill="#3bc9db"/>
    <text x="489" y="138" fill="#3bc9db" font-size="9" font-weight="700" letter-spacing="0.08em">STEP 2</text>
    <text x="489" y="153" fill="#c8d8ee" font-size="11">Open Repo</text>
    <text x="489" y="169" fill="#6b8cae" font-size="10">codex open .</text>

    <!-- Step 3 -->
    <rect x="475" y="194" width="140" height="62" rx="8" fill="#112236" stroke="#1e3a5a" stroke-width="1"/>
    <rect x="475" y="194" width="4" height="62" rx="2" fill="#a6e3a1"/>
    <text x="489" y="214" fill="#a6e3a1" font-size="9" font-weight="700" letter-spacing="0.08em">STEP 3</text>
    <text x="489" y="229" fill="#c8d8ee" font-size="11">Start Workflow</text>
    <text x="489" y="245" fill="#6b8cae" font-size="10">Pick your role</text>
  </g>

  <!-- Bottom label -->
  <rect x="0" y="340" width="640" height="40" fill="#091422" rx="0"/>
  <rect x="0" y="340" width="640" height="2" fill="url(#accent)" opacity="0.5"/>
  <text x="320" y="366" text-anchor="middle" fill="#4a6885" font-size="11" font-family="'DM Sans', sans-serif" letter-spacing="0.06em">CODEX BATMAN — INSTALLATION &amp; SETUP</text>
</svg>
