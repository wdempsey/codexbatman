  <text x="56" y="242" fill="#74c7ec" font-size="10" font-family="'JetBrains Mono', monospace">problem_frame.md</text>
  <text x="56" y="258" fill="#6b8cae" font-size="9.5" font-family="'JetBrains Mono', monospace">- target: SalePrice</text>
  <text x="56" y="272" fill="#6b8cae" font-size="9.5" font-family="'JetBrains Mono', monospace">- metric: RMSE</text>
  <text x="56" y="286" fill="#6b8cae" font-size="9.5" font-family="'JetBrains Mono', monospace">- risks: leakage</text>

