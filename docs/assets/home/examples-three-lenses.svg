  <text x="456" y="242" fill="#74c7ec" font-size="10" font-family="'JetBrains Mono', monospace">weekly_review.md</text>
  <text x="456" y="258" fill="#6b8cae" font-size="9.5" font-family="'JetBrains Mono', monospace">- status: on track</text>
  <text x="456" y="272" fill="#6b8cae" font-size="9.5" font-family="'JetBrains Mono', monospace">- blocker: data access</text>
  <text x="456" y="286" fill="#6b8cae" font-size="9.5" font-family="'JetBrains Mono', monospace">- next: stakeholder upd</text>

