      <stop offset="0%" stop-color="#5c7cfa"/>
      <stop offset="100%" stop-color="#3bc9db"/>
    </linearGradient>
  </defs>

  <rect width="640" height="380" fill="url(#ebg)" rx="12"/>
  <ellipse cx="320" cy="120" rx="220" ry="80" fill="rgba(92,124,250,0.05)"/>

