  <line x1="418" y1="106" x2="482" y2="172" stroke="#2a4a6a" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Student lens card -->
  <rect x="30" y="172" width="180" height="168" rx="10" fill="#0e1e30" stroke="#1e3a5a" stroke-width="1.2"/>
